; Additive FreePBX custom dialplan example. Do not edit extensions_additional.conf.
;
; Configure the recording disclosure that applies to your call flow before this
; hook runs. Make the spool directory writable by the Asterisk service user.

[call-leg-recording]
exten => s,1,NoOp(Start separate MixMonitor tracks for post-call transcription)
 same => n,GotoIf($["${CALL_LEG_MIXMON_STARTED}" = "1"]?done)
 same => n,Set(__CALL_LEG_MIXMON_STARTED=1)
 same => n,Set(CALL_LEG_STEM=/var/spool/asterisk/call-leg/${UNIQUEID})
 ; r() is received audio; t() is transmitted audio. Verify the channel
 ; perspective in your deployment and label the output accordingly.
 same => n,MixMonitor(${CALL_LEG_STEM}.wav,r(${CALL_LEG_STEM}-rx.wav)t(${CALL_LEG_STEM}-tx.wav))
 same => n(done),Return()

; FreePBX invokes the pre-dial hook with Gosub(). It must end with Return(),
; not MacroExit(), on current Asterisk versions.
[macro-dialout-trunk-predial-hook]
exten => s,1,Gosub(call-leg-recording,s,1)
 same => n,Return()

[macro-dial-one-predial-hook]
exten => s,1,Gosub(call-leg-recording,s,1)
 same => n,Return()

[macro-dial-predial-hook]
exten => s,1,Gosub(call-leg-recording,s,1)
 same => n,Return()
