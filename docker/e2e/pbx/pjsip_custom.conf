; Test-only endpoint. FreePBX reads this additive configuration.
[lab-client]
type = endpoint
context = from-internal
disallow = all
allow = ulaw
auth = lab-client
aors = lab-client
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[lab-client]
type = auth
auth_type = userpass
username = lab-client
password = lab-sip-password

[lab-client]
type = aor
max_contacts = 1
remove_existing = yes
